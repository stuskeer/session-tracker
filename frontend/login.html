<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Session Tracker</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .login-container {
        max-width: 440px;
        margin: 3rem auto;
        padding: 2.5rem;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        animation: slideUp 0.4s ease-out;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .login-form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .form-group {
        display: flex;
        flex-direction: column;
      }

      .form-group label {
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: var(--text-secondary);
        font-size: 0.95rem;
      }

      .form-group input {
        padding: 0.875rem;
        border: 2px solid var(--border);
        border-radius: 12px;
        font-size: 1rem;
        background: var(--bg-main);
        color: var(--text-primary);
        transition: all 0.3s ease;
      }

      .form-group input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
      }

      .login-btn {
        padding: 1rem;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: 0.5rem;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.3);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.5);
      }

      .register-btn {
        padding: 1rem;
        background: linear-gradient(135deg, var(--success), #059669);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: 0.5rem;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.3);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .register-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.5);
      }

      .toggle-link {
        text-align: center;
        margin-top: 1.5rem;
        color: var(--primary);
        cursor: pointer;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.2s;
        display: inline-block;
      }

      .toggle-link:hover {
        color: var(--secondary);
        transform: translateX(2px);
      }

      .error-message {
        color: var(--error);
        margin-top: 1rem;
        text-align: center;
        padding: 1rem;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: 12px;
        font-weight: 500;
      }

      .success-message {
        color: var(--success);
        margin-top: 1rem;
        text-align: center;
        padding: 1rem;
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.3);
        border-radius: 12px;
        font-weight: 500;
      }

      #form-title {
        margin-bottom: 1.5rem;
        font-size: 2rem;
      }
    </style>
  </head>
  <body>
    <img src="/images/logo.jpeg" alt="Session Tracker Logo" style="display:block; margin:auto; max-width:400px; margin-bottom: 2rem;" />
    
    <div class="login-container">
      <h1 id="form-title">Login</h1>
      
      <form id="auth-form" class="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required />
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required />
        </div>
        
        <button type="submit" id="submit-btn" class="login-btn">Login</button>
      </form>
      
      <div class="toggle-link" id="toggle-link">Don't have an account? Register here</div>
      
      <div id="auth-message"></div>
    </div>

    <script>
      let isLoginMode = true;
      
      document.getElementById("toggle-link").addEventListener("click", () => {
        isLoginMode = !isLoginMode;
        const formTitle = document.getElementById("form-title");
        const submitBtn = document.getElementById("submit-btn");
        const toggleLink = document.getElementById("toggle-link");
        
        if (isLoginMode) {
          formTitle.textContent = "Login";
          submitBtn.textContent = "Login";
          submitBtn.className = "login-btn";
          toggleLink.textContent = "Don't have an account? Register here";
        } else {
          formTitle.textContent = "Register";
          submitBtn.textContent = "Register";
          submitBtn.className = "register-btn";
          toggleLink.textContent = "Already have an account? Login here";
        }
        document.getElementById("auth-message").textContent = "";
      });
      
      document.getElementById("auth-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const form = e.target;
        const message = document.getElementById("auth-message");
        
        message.textContent = isLoginMode ? "Logging in..." : "Registering...";
        message.className = "";
        
        const data = {
          email: form.email.value,
          password: form.password.value,
        };
        
        const endpoint = isLoginMode ? "/auth/login" : "/auth/register";
        
        try {
          const res = await fetch(`http://localhost:3000${endpoint}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: 'include',
            body: JSON.stringify(data),
          });
          
          const result = await res.json();
          
          if (!res.ok) {
            message.textContent = result.error || (isLoginMode ? "Login failed" : "Registration failed");
            message.className = "error-message";
            return;
          }
          
          if (isLoginMode) {
            message.textContent = "✅ Login successful! Redirecting...";
            message.className = "success-message";
            
            // Redirect based on user role after successful login
            setTimeout(() => {
              if (result.user && result.user.role === 'admin') {
                window.location.href = "/admin.html";
              } else {
                window.location.href = "/index.html";
              }
            }, 1000);
          } else {
            message.textContent = "✅ Registration successful! You can now login.";
            message.className = "success-message";
            
            // Switch to login mode
            setTimeout(() => {
              isLoginMode = true;
              document.getElementById("form-title").textContent = "Login";
              document.getElementById("submit-btn").textContent = "Login";
              document.getElementById("submit-btn").className = "login-btn";
              document.getElementById("toggle-link").textContent = "Don't have an account? Register here";
              form.reset();
              message.textContent = "";
            }, 2000);
          }
          
        } catch (err) {
          message.textContent = "❌ Error: " + err.message;
          message.className = "error-message";
        }
      });
    </script>
  </body>
</html>
