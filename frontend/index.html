<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Session Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <img src="/images/logo.jpg" alt="Session Tracker Logo" style="display:block; margin:auto; max-width:200px;" />
    <h1>Kitesurf Session Tracker</h1>
    <p>This frontend calls your API running on port 3000:</p>
    <button id="fetch-btn">Fetch Sessions</button>
    <pre id="output">
        <div id="output">Waiting for data...</div>
    </pre>

    <details style="margin-top:2em;">
      <summary style="font-size:1.1em; cursor:pointer;">➕ Add Session</summary>
      <form id="add-session-form" style="margin-top:1em;">
        <input type="text" name="location" placeholder="Location" required />
        <input type="text" name="kite" placeholder="Kite" required />
        <input type="number" name="max_jump" placeholder="Max Jump" required />
        <button type="submit">Add Session</button>
      </form>
      <div id="add-session-message"></div>
    </details>

    <details style="margin-top:2em;">
      <summary style="font-size:1.1em; cursor:pointer;">🗑️ Remove Session</summary>
      <form id="remove-session-form" style="margin-top:1em;">
        <input type="text" name="id" placeholder="Session ID to remove" required />
        <button type="submit">Remove Session</button>
      </form>
      <div id="remove-session-message"></div>
    </details>
    <details style="margin-top:2em;">
      <summary style="font-size:1.1em; cursor:pointer;">✏️ Update Session</summary>
      <form id="update-session-form" style="margin-top:1em;">
        <input type="text" name="id" placeholder="Session ID to update" required />
        <input type="text" name="location" placeholder="New Location" required />
        <input type="text" name="kite" placeholder="New Kite" required />
        <input type="number" name="max_jump" placeholder="New Max Jump" required />
        <button type="submit">Update Session</button>
      </form>
      <div id="update-session-message"></div>
    </details>
    <script>
      document
        .getElementById("fetch-btn")
        .addEventListener("click", async () => {
          const output = document.getElementById("output");
          output.textContent = "Fetching data...";
          try {
            const res = await fetch("http://localhost:3000/sessions");
            if (!res.ok) throw new Error("HTTP " + res.status);
            const data = await res.json();
            
            if (data.length === 0) {
              output.innerHTML = "<p>No sessions yet.</p>";
              return;
            }
            
            let html = '<div class="sessions-grid">';
            data.forEach(session => {
              html += `<div class="session-card">
                <h3>📍 ${session.location}</h3>
                <p><strong>Kite:</strong> ${session.kite}</p>
                <p><strong>Max Jump:</strong> ${session.max_jump}m</p>
                <p class="session-id"><strong>ID:</strong> ${session.id}</p>
              </div>`;
            });
            html += '</div>';
            output.innerHTML = html;
          } catch (err) {
            output.textContent =
              "❌ Could not reach backend (" + err.message + ")";
          }
        });

      document
        .getElementById("add-session-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const form = e.target;
          const data = {
            id: form.id.value,
            location: form.location.value,
            kite: form.kite.value,
            max_jump: Number(form.max_jump.value),
          };
          try {
            const res = await fetch("http://localhost:3000/sessions", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data),
            });
            if (!res.ok) throw new Error("HTTP " + res.status);
            document.getElementById("add-session-message").textContent =
              "✅ Session added!";
            form.reset();
            // Optionally refresh session list:
            document.getElementById("fetch-btn").click();
          } catch (err) {
            document.getElementById("add-session-message").textContent =
              "❌ Error: " + err.message;
          }
        });

        document
        .getElementById("remove-session-form")
        .addEventListener("submit", async (e) => {
            e.preventDefault();
            const form = e.target;
            const message = document.getElementById("remove-session-message");
            message.textContent = "Removing session...";
            try {
            const res = await fetch(`http://localhost:3000/sessions/${form.id.value}`, {
                method: "DELETE",
            });
            if (!res.ok) throw new Error("HTTP " + res.status);
            message.textContent = "✅ Session removed!";
            form.querySelector('[name="id"]').value = "";
            document.getElementById("fetch-btn").click();
            } catch (err) {
            message.textContent = "❌ Could not remove session (" + err.message + ")";
            }
        });
    
    document
      .getElementById("update-session-form")
      .addEventListener("submit", async (e) => {
        e.preventDefault();
        const form = e.target;
        const message = document.getElementById("update-session-message");
        message.textContent = "Updating session...";
        const data = {
          location: form.location.value,
          kite: form.kite.value,
          max_jump: Number(form.max_jump.value),
        };
        try {
          const res = await fetch(`http://localhost:3000/sessions/${form.id.value}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          message.textContent = "✅ Session updated!";
          form.reset();
          document.getElementById("fetch-btn").click();
        } catch (err) {
          message.textContent = "❌ Could not update session (" + err.message + ")";
        }
      });
    </script>
  </body>
</html>
